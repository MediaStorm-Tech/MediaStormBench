[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cameralogbench"
version = "1.0.0"
description = "CameraLogBench: can multimodal models identify a camera's Log curve from video frames?"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MediaStorm" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/MediaStorm-Tech/MediaStormBench"
Source = "https://github.com/MediaStorm-Tech/MediaStormBench/tree/main/CameraLogBench"
Dataset = "https://huggingface.co/datasets/mediatech-tech/MediaStormBench"

[tool.setuptools.packages.find]
include = ["cameralogbench*"]

[tool.setuptools.package-data]
cameralogbench = ["reference/*.md", "reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
